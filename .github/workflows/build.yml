name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  schedule:
    # Prime the caches every Monday
    - cron: 0 1 * * MON

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - "macos-15-intel"    # x86_64
          - "macos-15"          # arm64
        packages:
          - "mach"
        ocaml-compiler:
          - "4.14"
          - "5.3"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set-up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Select Xcode
        run: |
          # macos-15 and macos-15-intel are the same image family, so both
          # architectures can pin the same Xcode and build against one SDK.
          # Tolerate its absence rather than failing the job on an image
          # refresh; the version is logged either way.
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install dependencies
        run: |
          opam install ${{matrix.packages}} --with-test --deps-only --with-dev-setup

      - name: Build
        run: |
          opam exec -- dune build @all

      - name: Tests
        run: |
          opam exec -- dune build @runtest

      - name: Format
        run: |
          opam exec -- dune build @fmt

      - name: Opam Lint
        run: |
          opam lint mach.opam
