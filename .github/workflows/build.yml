name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  schedule:
    # Prime the caches every Monday
    - cron: 0 1 * * MON

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - "macos-15-intel"    # x86_64
          - "macos-15"          # arm64
        packages:
          - "mach"
        ocaml-compiler:
          - "4.14"
          - "5.3"
        # The oldest SDK mach supports and the current one. Constants and
        # struct layouts are read from the headers, so the two can disagree:
        # Xcode 16.4 carries the macOS 15.5 SDK and 26.2 the macOS 26.2 SDK.
        xcode:
          - "16.4"
          - "26.2"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set-up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          # Fail rather than fall back: a job that silently built against a
          # different SDK than the one it names proves nothing.
          xcode=/Applications/Xcode_${{ matrix.xcode }}.app
          if [ ! -d "$xcode" ]; then
            echo "$xcode is not installed on this runner" >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Install dependencies
        run: |
          opam install ${{matrix.packages}} --with-test --deps-only --with-dev-setup

      - name: Build
        run: |
          opam exec -- dune build @all

      - name: Tests
        run: |
          opam exec -- dune build @runtest

      - name: Format
        run: |
          opam exec -- dune build @fmt

      - name: Opam Lint
        run: |
          opam lint mach.opam
